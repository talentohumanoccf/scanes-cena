<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Puerta en Vivo • Cena Benéfica Comfamiliar</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- html5-qrcode para Escaneo Continuo en Video -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      background-color: #001B2E;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #qr-video-reader video {
      border-radius: 20px;
      object-fit: cover;
      width: 100% !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 max-w-lg mx-auto">

  <!-- Cabecera Oficial -->
  <header class="text-center space-y-1.5 pb-3 border-b border-slate-700/60 relative">
    <div class="flex items-center justify-between">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-400 text-slate-900 text-[11px] font-black uppercase tracking-wider">
        <i class="fa-solid fa-qrcode"></i>
        <span>Acreditación en Puerta</span>
      </div>
      <button type="button" onclick="toggleModoDemo()" id="btnBadgeDemo" class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700 hover:border-amber-400 transition cursor-pointer">
        <span>Modo: </span><strong id="txtBadgeModo" class="text-emerald-400">En Vivo</strong>
      </button>
    </div>
    <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight">Cena Benéfica Katie James</h1>
    <p class="text-xs text-slate-400">Club Campestre Pereira • Control en Tiempo Real</p>
  </header>

  <!-- Contenedor Principal de la Cámara -->
  <main class="my-auto space-y-4 py-3">
    
    <!-- Visor de Video en Vivo -->
    <div class="relative bg-slate-900 rounded-3xl overflow-hidden border-2 border-amber-400/80 shadow-2xl min-h-[300px] flex items-center justify-center">
      <div id="qr-video-reader" class="w-full"></div>
      
      <!-- Marco Guía de Escaneo -->
      <div id="scannerOverlay" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center p-6">
        <div class="w-56 h-56 border-2 border-amber-400/70 rounded-2xl relative animate-pulse shadow-lg">
          <div class="absolute -top-1 -left-1 w-6 h-6 border-t-4 border-l-4 border-amber-400 rounded-tl-lg"></div>
          <div class="absolute -top-1 -right-1 w-6 h-6 border-t-4 border-r-4 border-amber-400 rounded-tr-lg"></div>
          <div class="absolute -bottom-1 -left-1 w-6 h-6 border-b-4 border-l-4 border-amber-400 rounded-bl-lg"></div>
          <div class="absolute -bottom-1 -right-1 w-6 h-6 border-b-4 border-r-4 border-amber-400 rounded-br-lg"></div>
        </div>
        <p class="text-[11px] text-amber-300 font-semibold mt-4 bg-slate-900/80 px-3 py-1 rounded-full backdrop-blur-xs">
          Apunta la cámara al código QR del pase
        </p>
      </div>

      <!-- Aviso Inicial si la cámara no ha arrancado -->
      <div id="camaraInitAviso" class="hidden text-center p-6 text-slate-300 space-y-3 z-10">
        <i class="fa-solid fa-camera text-5xl text-amber-400 block animate-bounce"></i>
        <div class="font-black text-base text-white">Cámara Lista para Escanear</div>
        <p class="text-xs text-slate-400 max-w-xs mx-auto">Presiona el botón para autorizar y encender el video en vivo.</p>
        <button type="button" onclick="iniciarVideoContinuo()" class="px-6 py-3 rounded-2xl bg-amber-400 hover:bg-amber-500 text-slate-950 font-black text-sm transition shadow-lg cursor-pointer">
          ▶ Iniciar Escáner en Vivo
        </button>
      </div>
    </div>

    <!-- Controles Rápidos -->
    <div class="flex items-center gap-2">
      <button type="button" onclick="cambiarCamara()" id="btnSwitchCam" class="flex-1 py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition flex items-center justify-center gap-2 border border-slate-700 cursor-pointer">
        <i class="fa-solid fa-arrows-rotate text-amber-400"></i>
        <span>Cambiar Cámara</span>
      </button>
      <button type="button" onclick="toggleModoManual()" class="flex-1 py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition flex items-center justify-center gap-2 border border-slate-700 cursor-pointer">
        <i class="fa-solid fa-keyboard text-amber-400"></i>
        <span>Buscar Manual</span>
      </button>
    </div>

    <!-- Búsqueda Manual Opcional -->
    <div id="wrapBusquedaManual" class="hidden bg-slate-800/90 p-4 rounded-2xl border border-slate-700 space-y-2">
      <form onsubmit="ejecutarBusquedaManual(event)" class="flex gap-2">
        <input type="text" id="inputManualCodigo" placeholder="Código (ej. CENA-005) o Cédula..." 
          class="flex-1 px-4 py-2 text-xs font-bold rounded-xl bg-slate-900 border border-slate-600 text-white uppercase focus:border-amber-400 outline-none" />
        <button type="submit" class="px-4 py-2 bg-amber-400 hover:bg-amber-500 text-slate-950 font-black text-xs rounded-xl transition cursor-pointer">
          Validar
        </button>
      </form>
    </div>

    <!-- TARJETA DE RESULTADO FLOTANTE AL ESCANEAR -->
    <div id="resultadoModalWrap" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
      <div id="resultadoModalCard" class="bg-white text-slate-900 w-full max-w-sm rounded-3xl p-5 shadow-2xl border-2 border-emerald-400 space-y-4 animate-in zoom-in-95 duration-150">
        <!-- Rellenado dinámicamente -->
      </div>
    </div>

  </main>

  <!-- Pie con Estado del Aforo y Conexión -->
  <footer class="text-center pt-3 border-t border-slate-800 text-xs text-slate-400 space-y-1">
    <div class="flex items-center justify-between text-[11px] text-slate-400 px-2 font-medium">
      <span class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="txtEstadoConexion">Conectado a Google Sheets</span>
      </span>
      <span id="footerAforoTxt">Aforo: 300 cupos</span>
    </div>
  </footer>

  <script>
    // URL OFICIAL DEL BACKEND (Google Apps Script)
    const DEFAULT_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyisT_KxW3GshQCmjrSli6SqxrhVhvFMIcHlAAM1Q92BBeGLY4R_vAVf0Lz3YI-Tbi1/exec';
    let APPS_SCRIPT_URL = localStorage.getItem('cf_scanner_api_url') || DEFAULT_APPS_SCRIPT_URL;

    // Si viene por parámetro en la URL (?api=...)
    try {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('api')) {
        APPS_SCRIPT_URL = urlParams.get('api');
        localStorage.setItem('cf_scanner_api_url', APPS_SCRIPT_URL);
      }
    } catch(e) {}

    let html5QrScanner = null;
    let camarasDisponibles = [];
    let camaraActualIndex = 0;
    let procesandoScan = false;
    let __reservaActual = null;
    let __modoDemoActivo = false;

    // Base de datos de reserva para pruebas sin conexión
    let __reservasDemo = [
      { idReserva: "CENA-2026-0001", nombre: "Carlos Andrés Pérez", cedula: "1088234567", cantidadBoletas: 2, acompanantes: "María Gómez", valorFormato: "$ 1.200.000", asistenciaPuerta: "Pendiente" },
      { idReserva: "CENA-2026-0002", nombre: "Constructora del Café S.A.S.", cedula: "900.123.456-7", cantidadBoletas: 15, acompanantes: "Delegación Directiva (15 cupos)", valorFormato: "$ 5.000.000", asistenciaPuerta: "Ingresó" },
      { idReserva: "CENA-2026-0003", nombre: "Dra. Patricia Jaramillo", cedula: "42150998", cantidadBoletas: 1, acompanantes: "", valorFormato: "$ 500.000", asistenciaPuerta: "Pendiente" }
    ];

    function toggleModoDemo() {
      __modoDemoActivo = !__modoDemoActivo;
      actualizarIndicadorModo();
    }

    function activarModoDemo() {
      __modoDemoActivo = true;
      actualizarIndicadorModo();
      cerrarModalResultado();
      alert('🧪 ¡Modo Demostración Activado!\nPuedes escanear cualquier código QR o buscar en manual: CENA-2026-0001, CENA-2026-0002 o cédula 1088234567.');
    }

    function actualizarIndicadorModo() {
      const badgeTxt = document.getElementById('txtBadgeModo');
      const connTxt = document.getElementById('txtEstadoConexion');
      if (__modoDemoActivo) {
        if (badgeTxt) { badgeTxt.innerText = 'Pruebas / Demo'; badgeTxt.className = 'text-amber-400 font-bold'; }
        if (connTxt) connTxt.innerText = 'Modo Demostración (Simulado)';
      } else {
        if (badgeTxt) { badgeTxt.innerText = 'En Vivo'; badgeTxt.className = 'text-emerald-400 font-bold'; }
        if (connTxt) connTxt.innerText = 'Conectado a Google Sheets';
      }
    }

    // Cliente Híbrido (Fetch Directo + Fallback JSONP) para consultar y actualizar Google Sheets sin restricciones
    async function llamarApiAppsScript(params, callback) {
      if (__modoDemoActivo) {
        setTimeout(() => {
          if (params.action === 'validarReserva') {
            const termino = String(params.codigo || '').trim().toUpperCase();
            let encontrada = __reservasDemo.find(r => 
              String(r.idReserva).toUpperCase() === termino ||
              String(r.cedula).replace(/\D/g, '') === termino.replace(/\D/g, '') ||
              String(r.nombre).toUpperCase().indexOf(termino) !== -1
            );
            if (!encontrada) {
              encontrada = {
                idReserva: termino.startsWith('CENA') ? termino : 'DEMO-' + termino.slice(0, 8),
                nombre: 'Invitado(a) de Prueba',
                cedula: '1088000111',
                cantidadBoletas: 2,
                acompanantes: 'Acompañante de Prueba',
                valorFormato: '$ 1.200.000',
                asistenciaPuerta: 'Pendiente'
              };
              __reservasDemo.push(encontrada);
            }
            callback(null, { status: 'success', reserva: encontrada });
          } else if (params.action === 'checkin') {
            const res = __reservasDemo.find(r => r.idReserva === params.id);
            if (res) res.asistenciaPuerta = params.estado;
            callback(null, { status: 'success' });
          } else {
            callback(null, { status: 'success' });
          }
        }, 200);
        return;
      }

      // ESTRATEGIA 1: Fetch directo con CORS y redirección automática (302)
      try {
        const qsFetch = new URLSearchParams(params);
        const urlFetch = APPS_SCRIPT_URL + '?' + qsFetch.toString();
        const controller = new AbortController();
        const tId = setTimeout(() => controller.abort(), 7000);

        const resp = await fetch(urlFetch, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-cache',
          redirect: 'follow',
          signal: controller.signal
        });
        clearTimeout(tId);

        if (resp.ok) {
          const contentType = resp.headers.get('content-type') || '';
          if (contentType.includes('application/json') || contentType.includes('text/plain')) {
            const data = await resp.json();
            return callback(null, data);
          }
        }
      } catch (fetchErr) {
        console.warn('Fetch no disponible o bloqueado por CORS, intentando JSONP...', fetchErr);
      }

      // ESTRATEGIA 2: JSONP (Inyección dinámica de script con callback)
      const cbName = '__cb_' + Math.round(1000000 * Math.random());
      let respondido = false;
      const temporizador = setTimeout(() => {
        if (!respondido) {
          respondido = true;
          delete window[cbName];
          if (script && script.parentNode) script.parentNode.removeChild(script);
          callback(new Error('Tiempo de espera agotado con Google Sheets'));
        }
      }, 9000);

      window[cbName] = function(data) {
        if (respondido) return;
        respondido = true;
        clearTimeout(temporizador);
        delete window[cbName];
        if (script && script.parentNode) script.parentNode.removeChild(script);
        callback(null, data);
      };

      const qs = new URLSearchParams(params);
      qs.set('callback', cbName);

      const script = document.createElement('script');
      script.src = APPS_SCRIPT_URL + '?' + qs.toString();
      script.onerror = function() {
        if (respondido) return;
        respondido = true;
        clearTimeout(temporizador);
        delete window[cbName];
        if (script && script.parentNode) script.parentNode.removeChild(script);
        callback(new Error('Error de conexión con Google Sheets'));
      };
      document.body.appendChild(script);
    }

    // Audio de confirmación al escanear
    function sonarBeep(tipo) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (tipo === 'exito') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
          osc.start();
          osc.stop(ctx.currentTime + 0.18);
        } else {
          osc.type = 'square';
          osc.frequency.setValueAtTime(320, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        }
      } catch (e) {}
    }

    // Arrancar video continuo con cámara trasera
    function iniciarVideoContinuo() {
      if (typeof Html5Qrcode === 'undefined') {
        alert('Cargando librería de cámara... Por favor espera un segundo.');
        return;
      }

      Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length) {
          camarasDisponibles = devices;
          const traseraIndex = devices.findIndex(d => 
            d.label.toLowerCase().includes('back') || 
            d.label.toLowerCase().includes('trasera') || 
            d.label.toLowerCase().includes('environment')
          );
          camaraActualIndex = (traseraIndex !== -1) ? traseraIndex : devices.length - 1;
          arrancarConCamaraId(camarasDisponibles[camaraActualIndex].id);
        } else {
          arrancarFacingMode();
        }
      }).catch(err => {
        console.warn('getCameras fallback:', err);
        arrancarFacingMode();
      });
    }

    function arrancarFacingMode() {
      if (!html5QrScanner) {
        html5QrScanner = new Html5Qrcode('qr-video-reader');
      }
      const config = { fps: 15, qrbox: { width: 220, height: 220 } };
      html5QrScanner.start(
        { facingMode: 'environment' },
        config,
        (decodedText) => onQRDetectado(decodedText),
        () => {}
      ).then(() => {
        document.getElementById('camaraInitAviso').classList.add('hidden');
      }).catch(err => {
        document.getElementById('camaraInitAviso').classList.remove('hidden');
      });
    }

    function arrancarConCamaraId(camId) {
      if (!html5QrScanner) {
        html5QrScanner = new Html5Qrcode('qr-video-reader');
      }
      const config = { fps: 15, qrbox: { width: 220, height: 220 } };
      html5QrScanner.start(
        camId,
        config,
        (decodedText) => onQRDetectado(decodedText),
        () => {}
      ).then(() => {
        document.getElementById('camaraInitAviso').classList.add('hidden');
      }).catch(err => {
        console.error('Error con camId:', err);
        arrancarFacingMode();
      });
    }

    function cambiarCamara() {
      if (camarasDisponibles.length > 1 && html5QrScanner) {
        html5QrScanner.stop().then(() => {
          camaraActualIndex = (camaraActualIndex + 1) % camarasDisponibles.length;
          arrancarConCamaraId(camarasDisponibles[camaraActualIndex].id);
        });
      }
    }

    function toggleModoManual() {
      const wrap = document.getElementById('wrapBusquedaManual');
      wrap.classList.toggle('hidden');
      if (!wrap.classList.contains('hidden')) {
        document.getElementById('inputManualCodigo').focus();
      }
    }

    function onQRDetectado(codigo) {
      if (procesandoScan) return;
      procesandoScan = true;
      sonarBeep('exito');

      // Pausar lector mientras se muestra el resultado
      if (html5QrScanner) {
        try { html5QrScanner.pause(true); } catch(e) {}
      }

      validarReservaEnServidor(codigo);
    }

    function ejecutarBusquedaManual(e) {
      if (e) e.preventDefault();
      const val = (document.getElementById('inputManualCodigo').value || '').trim();
      if (!val) return;
      procesandoScan = true;
      validarReservaEnServidor(val);
    }

    // Consulta en tiempo real a Google Sheets
    function validarReservaEnServidor(codigo) {
      const modal = document.getElementById('resultadoModalWrap');
      const card = document.getElementById('resultadoModalCard');
      modal.classList.remove('hidden');

      card.innerHTML = `
        <div class="py-6 text-center space-y-3">
          <i class="fa-solid fa-spinner fa-spin text-3xl text-amber-500"></i>
          <div class="text-sm font-black text-slate-800">Verificando Reserva en Google Sheets...</div>
          <p class="text-xs text-slate-500 font-mono font-bold">${codigo}</p>
        </div>
      `;

      llamarApiAppsScript({ action: 'validarReserva', codigo: codigo }, (err, res) => {
        if (err || !res) {
          sonarBeep('error');
          card.innerHTML = `
            <div class="text-center space-y-3">
              <div class="w-14 h-14 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-2xl mx-auto font-black">✕</div>
              <h3 class="text-base font-black text-rose-900">Error de Conexión</h3>
              <p class="text-xs text-slate-600">No se pudo conectar con el servidor de Google Sheets.</p>
              <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-200 text-left text-[11px] text-amber-900 space-y-1">
                <p class="font-bold">💡 Para conectar en tiempo real:</p>
                <p>En Google Apps Script haz clic en <strong>Implementar > Administrar implementaciones > Editar > Nueva versión > Implementar</strong>.</p>
              </div>
              <button type="button" onclick="activarModoDemo()" class="w-full py-2.5 rounded-xl bg-amber-400 hover:bg-amber-500 text-slate-950 font-black text-xs cursor-pointer shadow-sm transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-flask"></i> <span>Probar en Modo Demostración (Offline)</span>
              </button>
              <button type="button" onclick="cerrarModalResultado()" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs cursor-pointer">
                Reintentar Conexión
              </button>
            </div>
          `;
          return;
        }

        if (res.status === 'not_found' || !res.reserva) {
          sonarBeep('error');
          card.innerHTML = `
            <div class="text-center space-y-3">
              <div class="w-14 h-14 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-2xl mx-auto font-black">✕</div>
              <h3 class="text-base font-black text-rose-900">Reserva No Encontrada</h3>
              <p class="text-xs text-slate-600">El código <strong>"${codigo}"</strong> no figura en la lista oficial de reservas.</p>
              <button type="button" onclick="cerrarModalResultado()" class="w-full py-2.5 rounded-xl bg-slate-900 text-white font-bold text-xs cursor-pointer">
                Escanear Siguiente
              </button>
            </div>
          `;
          return;
        }

        mostrarDetalleReserva(res.reserva);
      });
    }

    function mostrarDetalleReserva(r) {
      __reservaActual = r;
      const card = document.getElementById('resultadoModalCard');
      const yaIngreso = (r.asistenciaPuerta === 'Ingresó' || r.asistenciaPuerta === 'Ingreso');

      if (yaIngreso) {
        card.innerHTML = `
          <div class="space-y-3 text-center">
            <div class="w-14 h-14 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-2xl mx-auto font-black border border-amber-300">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div>
              <span class="text-[10px] bg-amber-200 text-amber-900 font-black px-2.5 py-0.5 rounded-full uppercase">Ya Registrado</span>
              <h3 class="text-lg font-black text-amber-950 mt-1">Este pase ya ingresó</h3>
              <p class="text-xs text-slate-500 font-mono font-bold">${r.idReserva}</p>
            </div>

            <div class="bg-amber-50 p-3.5 rounded-2xl border border-amber-200 text-left text-xs space-y-1.5">
              <div class="flex justify-between"><span class="text-slate-500">Titular / Empresa:</span><span class="font-black text-slate-900">${r.nombre}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Cédula / NIT:</span><span class="font-bold text-slate-700">${r.cedula}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Cupos:</span><span class="font-black text-amber-800">${r.cantidadBoletas} personas</span></div>
              ${r.acompanantes ? `<div class="pt-1 text-[11px] text-slate-600 border-t border-amber-200"><strong>Acompañantes:</strong> ${r.acompanantes}</div>` : ''}
            </div>

            <div class="flex gap-2 pt-1">
              <button type="button" onclick="ejecutarCambioEstado('${r.idReserva}', 'Pendiente')" class="flex-1 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs cursor-pointer">
                Revertir a Pendiente
              </button>
              <button type="button" onclick="cerrarModalResultado()" class="flex-1 py-2.5 rounded-xl bg-slate-900 text-white font-black text-xs cursor-pointer">
                Escanear Siguiente
              </button>
            </div>
          </div>
        `;
      } else {
        card.innerHTML = `
          <div class="space-y-3 text-center">
            <div class="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl mx-auto font-black shadow-xs">
              ✓
            </div>
            <div>
              <span class="text-[10px] bg-emerald-100 text-emerald-800 font-black px-2.5 py-0.5 rounded-full uppercase">Pase Oficial Válido</span>
              <h3 class="text-lg font-black text-slate-900 mt-1">Ingreso Permitido</h3>
              <p class="text-xs text-slate-500 font-mono font-bold">${r.idReserva}</p>
            </div>

            <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 text-left text-xs space-y-1.5">
              <div class="flex justify-between"><span class="text-slate-500">Titular / Empresa:</span><span class="font-black text-slate-900">${r.nombre}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Cédula / NIT:</span><span class="font-bold text-slate-700">${r.cedula}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Cupos Autorizados:</span><span class="font-black text-emerald-700 text-sm">${r.cantidadBoletas} asistente(s)</span></div>
              ${r.acompanantes ? `<div class="pt-1 text-[11px] text-slate-600 border-t border-slate-200"><strong>Acompañantes:</strong> ${r.acompanantes}</div>` : ''}
            </div>

            <button type="button" onclick="ejecutarCambioEstado('${r.idReserva}', 'Ingresó')" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-700 hover:to-emerald-800 text-white font-black text-sm shadow-md transition cursor-pointer">
              🚪 CONFIRMAR INGRESO EN PUERTA
            </button>
          </div>
        `;
      }
    }

    // Envía la confirmación a Google Sheets en tiempo real
    function ejecutarCambioEstado(idReserva, nuevoEstado) {
      const card = document.getElementById('resultadoModalCard');
      card.innerHTML = `
        <div class="py-6 text-center space-y-2">
          <i class="fa-solid fa-spinner fa-spin text-3xl text-emerald-600"></i>
          <div class="text-sm font-black text-slate-800">Registrando en Google Sheets...</div>
        </div>
      `;

      llamarApiAppsScript({ action: 'checkin', id: idReserva, estado: nuevoEstado }, (err, res) => {
        sonarBeep('exito');
        card.innerHTML = `
          <div class="text-center space-y-3">
            <div class="w-14 h-14 rounded-full bg-emerald-500 text-white flex items-center justify-center text-3xl mx-auto font-black shadow-md">✓</div>
            <h3 class="text-base font-black text-emerald-950 uppercase">${nuevoEstado === 'Ingresó' ? '¡Ingreso Confirmado!' : 'Estado Actualizado'}</h3>
            <p class="text-xs text-emerald-800">Se registró la entrada de la reserva <strong>${idReserva}</strong> en Google Sheets.</p>
            <button type="button" onclick="cerrarModalResultado()" class="w-full py-3 rounded-2xl bg-slate-900 text-white font-black text-xs cursor-pointer shadow-sm">
              Escanear Siguiente Pase
            </button>
          </div>
        `;
      });
    }

    function cerrarModalResultado() {
      document.getElementById('resultadoModalWrap').classList.add('hidden');
      procesandoScan = false;
      if (html5QrScanner) {
        try { html5QrScanner.resume(); } catch(e) {}
      }
    }

    // Arrancar la cámara automáticamente al abrir la página
    window.addEventListener('DOMContentLoaded', () => {
      iniciarVideoContinuo();
    });
  </script>
</body>
</html>
